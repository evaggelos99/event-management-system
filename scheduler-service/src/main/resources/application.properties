io.github.evaggelos99.ems.scheduler-service.sql.get-attendee-to-be-emailed=\
    SELECT ev.id AS event_uid, \
    ev.name AS event_name, \
    ev.place AS event_place, \
    u.email AS attendee_email, \
    u.first_name AS first_name, \
    u.last_name AS last_name \
    FROM ems_event.events ev \
    JOIN ems_event.attendee_mapping am ON ev.id = am.event_id \
    JOIN ems_admin.user_id_map_to_attendee ua ON ua.entity_id = am.attendee_id \
    JOIN ems_admin.users u ON u.id = ua.user_id \
    WHERE ev.start_time BETWEEN NOW() AND NOW() + INTERVAL '2 days';

io.github.evaggelos99.ems.scheduler-service.sql.save-email=\
  INSERT INTO ems_attendee.email (from_email, to_email, cc, body, from_name, to_name, subject) \
  values (?, ?, ?, ?, ?, ?, ?);

io.github.evaggelos99.ems.scheduler-service.sql.save-feedback=\
  INSERT INTO ems_event.feedback (event_uid, rating, liked_most, what_can_be_improved, other_comments, created_at, ticket_id) \
  values (?, ?, ?, ?, ?,?,?);

io.github.evaggelos99.ems.scheduler-service.sql.get-attendees-that-attendeed-past-events-1-day=\
    SELECT \
    ti.id as ticket_id, \
    us.email AS attendee_email, \
    us.first_name AS first_name, \
    us.last_name AS last_name, \
    ev.id AS event_id, \
    ev.name AS event_name, \
    ev.place AS event_place \
    FROM ems_ticket.tickets ti \
    JOIN ems_attendee.ticket_mapping tm ON tm.ticket_id = ti.id \
    JOIN ems_attendee.attendees att ON tm.attendee_id = att.id \
    JOIN ems_admin.user_id_map_to_attendee ua ON ua.entity_id = att.id \
    JOIN ems_event.events ev ON ev.id = ti.event_id \
    JOIN ems_admin.users us ON us.id = ua.user_id \
    WHERE ti.used='false';
# TODO change the used='false' to true

